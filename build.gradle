plugins {
    // Versão do MDK oficial 1.21.1; aplicada somente aos módulos.
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

allprojects {
    group = 'dev.luxmods'
    version = findProperty('mod_version')
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'net.neoforged.moddev'

    base {
        archivesName = project.name
    }
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    sourceSets.main.resources {
        srcDir('src/generated/resources')
        exclude('**/*.bbmodel')
    }

    neoForge {
        version = rootProject.property('neo_version')
        parchment {
            minecraftVersion = rootProject.property('parchment_minecraft_version')
            mappingsVersion = rootProject.property('parchment_mappings_version')
        }
        runs {
            client { client() }
            server {
                server()
                programArgument '--nogui'
            }
            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.INFO
            }
        }
        mods {
            "${project.name.replace('-', '_')}" {
                sourceSet(sourceSets.main)
            }
        }
    }

    // NeoForge/ModDevGradle requires explicit opt-in to run JUnit within the mod context.
    // See official ModDevGradle documentation, 'Unit testing with JUnit'.
    neoForge {
        unitTest {
            enable()
            testedMod = mods."${project.name.replace('-', '_')}"
        }
    }

    def metadataValues = [
        mod_id: project.name.replace('-', '_'),
        mod_name: ['lux-engine':'Lux Engine', 'lux-discovery':'Lux Discovery', 'lux-atlas':'Lux Atlas'].get(project.name),
        mod_version: project.version,
        mod_license: 'All Rights Reserved',
        minecraft_version_range: rootProject.property('minecraft_version_range'),
        neo_version: rootProject.property('neo_version'),
        loader_version_range: rootProject.property('loader_version_range')
    ]

    def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
        inputs.properties metadataValues
        expand metadataValues
        from 'src/main/templates'
        into 'build/generated/sources/modMetadata'
    }

    sourceSets.main.resources.srcDir generateModMetadata
    neoForge.ideSyncTask generateModMetadata

    repositories {
        mavenCentral()
    }
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// Evaluate Engine before Discovery references its sourceSets, as in official MDG testproject.
project(':lux-discovery').evaluationDependsOn(':lux-engine')

// No empacotamento, os dois JARs permanecem separados e independentes.
project(':lux-discovery') {
    dependencies {
        // Compilação normal: Discovery consome a API do Engine, mas não embute
        // as classes dele no JAR final. Os dois artefatos são distribuídos separadamente.
        implementation project(':lux-engine')
    }

    neoForge {
        mods {
            // Registra o Engine como um segundo mod LOCAL para :lux-discovery:runClient,
            // :lux-discovery:runServer e testes NeoForge. Uma dependência Gradle por
            // si só não equivale ao registro explícito do mod na configuração de run.
            lux_engine {
                sourceSet project(':lux-engine').sourceSets.main
            }
        }
        unitTest {
            // JUnit no contexto do Discovery exige também o Engine, pois
            // lux_discovery o declara como mod obrigatório no neoforge.mods.toml.
            loadedMods = [mods.lux_discovery, mods.lux_engine]
        }
    }
}

 
project(':lux-atlas').evaluationDependsOn(':lux-engine')
project(':lux-atlas') {
    dependencies { implementation project(':lux-engine') }
    neoForge {
        mods {
            lux_engine { sourceSet project(':lux-engine').sourceSets.main }
        }
        unitTest { loadedMods = [mods.lux_atlas, mods.lux_engine] }
    }
}

// A single task packages the three development JARs in one isolated mods directory.
// This does NOT download the Minecraft client or change a user's .minecraft.
tasks.register('assembleTestPack', Sync) {
    group = 'lux mods'
    description = 'Build and copy Lux Engine + Discovery + Atlas jars for a clean Minecraft test instance.'
    dependsOn ':lux-engine:build', ':lux-discovery:build', ':lux-atlas:build'
    into(layout.buildDirectory.dir('lux-testpack/mods'))
    from(project(':lux-engine').tasks.named('jar'))
    from(project(':lux-discovery').tasks.named('jar'))
    from(project(':lux-atlas').tasks.named('jar'))
}
