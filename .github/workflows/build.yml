name: NeoForge build

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar e testar os módulos
        run: ./gradlew build --no-daemon --stacktrace
      - name: Salvar os JARs quando build passar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lux-mods-jar-dev
          path: modules/*/build/libs/*.jar
          if-no-files-found: error
