pluginManagement { repositories { gradlePluginPortal() } }

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Lux-Mods'
include ':lux-engine', ':lux-discovery', ':lux-atlas', ':lux-hud', ':lux-menu', ':lux-borderless', ':lux-dialogues'
project(':lux-engine').projectDir = file('modules/lux-engine')
project(':lux-discovery').projectDir = file('modules/lux-discovery')
project(':lux-atlas').projectDir = file('modules/lux-atlas')
project(':lux-hud').projectDir = file('modules/lux-hud')
project(':lux-menu').projectDir = file('modules/lux-menu')
project(':lux-borderless').projectDir = file('modules/lux-borderless')
project(':lux-dialogues').projectDir = file('modules/lux-dialogues')
